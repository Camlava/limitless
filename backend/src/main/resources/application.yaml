spring:
  datasource:
    url: jdbc:mysql://localhost:3306/limitless
    username: limitless_user
    password: limitless_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration